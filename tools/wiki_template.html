<title>Huffman 壓縮 LLM Wiki</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: two-pane reference wiki — sticky index rail left, one article at a time right; stacks on phones. */
:root {
  --bg: #eef1f6; --paper: #fbfcfe; --ink: #142033; --muted: #5b6678; --line: #d5dbe6;
  --accent: #2c54d6; --accent-soft: #e3e9fb; --bit: #c98a00; --bit-soft: #fbf0d6; --warn-soft: #f8e5df;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d121b; --paper: #141b27; --ink: #e6ebf3; --muted: #9aa5b8; --line: #2a3446;
  --accent: #7d9bff; --accent-soft: #1d2a4a; --bit: #f0b429; --bit-soft: #3a2e10; --warn-soft: #3d2019; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d121b; --paper: #141b27; --ink: #e6ebf3; --muted: #9aa5b8; --line: #2a3446;
  --accent: #7d9bff; --accent-soft: #1d2a4a; --bit: #f0b429; --bit-soft: #3a2e10; --warn-soft: #3d2019; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font: 16px/1.75 var(--font-body); }
.mono, code, pre { font-family: var(--font-mono); }
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px; }
nav { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 32px); overflow: auto;
  display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; }
nav .brand { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.3; margin-bottom: 6px; }
nav .brand small { display: block; font: 12px var(--font-mono); color: var(--bit); letter-spacing: .1em; }
nav .nav-h { margin: 14px 0 4px; font: 600 12px var(--font-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
nav a { color: var(--ink); text-decoration: none; padding: 4px 10px; border-radius: 6px; line-height: 1.45; }
nav a:hover { background: var(--accent-soft); }
nav a.on { background: var(--accent); color: var(--paper); }
main { min-width: 0; }
.page { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 28px 36px 32px; }
.page:not(.on) { display: none; }
.path { color: var(--bit); font-size: 13px; margin: 0 0 6px; letter-spacing: .04em; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.25; margin: 0 0 14px; text-wrap: balance; }
h2 { font-size: 20px; margin: 26px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
h3 { font-size: 17px; margin: 22px 0 6px; color: var(--accent); scroll-margin-top: 24px; }
h3:target { background: var(--bit-soft); border-radius: 6px; padding: 2px 8px; }
p, li { max-width: 72ch; }
ul { padding-left: 1.3em; }
li { margin: 4px 0; }
a { color: var(--accent); }
a.src, .src-demo { font: 11.5px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; border: 1px solid var(--accent); text-decoration: none; white-space: nowrap; vertical-align: 2px; }
a.wl { font-weight: 700; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.calc { font: 11.5px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px; background: var(--bit-soft); color: var(--ink); border: 1px solid var(--bit); vertical-align: 2px; }
code { background: var(--bit-soft); padding: 0 .3em; border-radius: 4px; font-size: .9em; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
pre code { background: none; padding: 0; }
.tw, .page table { display: block; overflow-x: auto; }
table { border-collapse: collapse; font-size: 14.5px; margin: 10px 0; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.raw { border-style: dashed; }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; flex-direction: row; flex-wrap: wrap; gap: 4px; }
  nav .brand { width: 100%; }
  nav .nav-h { width: 100%; margin: 8px 0 0; }
  nav a { border: 1px solid var(--line); font-size: 13px; }
  .page { padding: 20px 18px; }
  h1 { font-size: 24px; }
}
</style>
<div class="shell">
  <nav aria-label="Wiki 目錄">
    <div class="brand"><small>01001000 · LLM WIKI</small>資料壓縮：Huffman 與算術編碼</div>
<!--NAV-->
  </nav>
  <main>
<!--PAGES-->
  </main>
</div>
<script>
(() => {
  const pages = [...document.querySelectorAll(".page")];
  const links = [...document.querySelectorAll("nav a")];
  function route() {
    const id = decodeURIComponent(location.hash.slice(1)) || "about";
    let page = document.getElementById(id);
    let target = null;
    if (page && !page.classList.contains("page")) { target = page; page = page.closest(".page"); }
    if (!page) page = document.getElementById("about");
    pages.forEach((p) => p.classList.toggle("on", p === page));
    links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + page.id));
    if (target) target.scrollIntoView({ block: "start" }); else window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
